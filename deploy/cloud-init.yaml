#cloud-config
# Applied at first boot by azure-provision.sh. Installs Docker and adds swap so that building
# the web image (tsc plus Vite wants roughly 2GB) cannot exhaust a 4GB burstable VM.
package_update: true
packages:
  - ca-certificates
  - curl
  - git
  - ufw

write_files:
  - path: /root/bootstrap.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      . /etc/os-release
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" \
        > /etc/apt/sources.list.d/docker.list
      apt-get update
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      usermod -aG docker azureuser

      if [ ! -f /swapfile ]; then
        fallocate -l 2G /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
        swapon /swapfile
        echo '/swapfile none swap sw 0 0' >> /etc/fstab
      fi

      # The subnet NSG is the real gate; this is a second layer on the host itself.
      ufw allow OpenSSH
      ufw allow 80,443/tcp
      ufw --force enable

runcmd:
  - /root/bootstrap.sh
