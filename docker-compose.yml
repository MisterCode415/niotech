services:
  postgres:
    image: postgres:17-alpine
    container_name: nio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nio
      POSTGRES_PASSWORD: nio
      POSTGRES_DB: nio
    ports:
      # Loopback-only. Docker publishes to every interface by default, which would expose these
      # services to the network the moment this file is used anywhere but a laptop.
      - '127.0.0.1:5433:5432'
    volumes:
      - nio-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nio -d nio']
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: nio-mailpit
    restart: unless-stopped
    ports:
      # The Mailpit UI shows every notification email, including patient names and result links.
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # Web UI
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  nio-pgdata:
