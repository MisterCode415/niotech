services:
  postgres:
    image: postgres:17-alpine
    container_name: nio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nio
      POSTGRES_PASSWORD: nio
      POSTGRES_DB: nio
    ports:
      - '5433:5432'
    volumes:
      - nio-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nio -d nio']
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: nio-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  nio-pgdata:
